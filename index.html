<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links | Nossa Igreja</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <div class="logo-placeholder">
                <i class="fas fa-church"></i>
            </div>
            <h1>Nossa Igreja</h1>
            <p>Seja muito bem-vindo!</p>
        </header>

        <!-- Seção de Avisos com seus horários -->
        <section class="avisos">
            <h3><i class="far fa-calendar-alt"></i> Nossos Cultos</h3>
            <div class="grade-horarios">
                <div class="dia">
                    <strong>Quarta-feira</strong>
                    <span>19h30 | Quarta da Palavra</span>
                </div>
                <div class="divisor-vertical"></div>
                <div class="dia">
                    <strong>Domingo</strong>
                    <span>19h00 | Celebração</span>
                </div>
            </div>
        </section>

        <main class="links">
            <!-- Cole os links entre as aspas do href -->
            <a href="COLE_AQUI_LINK_INSTAGRAM_IGREJA" class="btn principal" target="_blank">
                <i class="fab fa-instagram"></i> Instagram da Igreja
            </a>
            
            <a href="COLE_AQUI_LINK_YOUTUBE_IGREJA" class="btn principal" target="_blank">
                <i class="fab fa-youtube"></i> Canal no YouTube
            </a>

            <div class="divisor">
                <span>Nossos Pastores</span>
            </div>

            <a href="COLE_AQUI_LINK_INSTAGRAM_PASTOR" class="btn secundario" target="_blank">
                <i class="fab fa-instagram"></i> Pastor(a) Nome
            </a>
            
            <a href="COLE_AQUI_LINK_INSTAGRAM_PASTOR_2" class="btn secundario" target="_blank">
                <i class="fab fa-instagram"></i> Pastor(a) Nome
            </a>
        </main>

        <footer>
            <p>© 2026 Nossa Igreja</p>
        </footer>
    </div>

</body>
</html>
