<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links | Nossa Igreja</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <div class="logo-placeholder">
                <i class="fas fa-church"></i>
            </div>
            <h1>Nossa Igreja</h1>
            <p>Conectando vidas ao Reino</p>
        </header>

        <section class="avisos">
            <h3><i class="far fa-calendar-alt"></i> Próximos Cultos</h3>
            <div class="grade-horarios">
                <span><strong>Dom:</strong> 19h</span>
                <span><strong>Qua:</strong> 20h</span>
            </div>
        </section>

        <main class="links">
            <a href="URL_DO_INSTAGRAM" class="btn principal" target="_blank">
                <i class="fab fa-instagram"></i> Instagram Oficial
            </a>
            <a href="URL_DO_YOUTUBE" class="btn principal" target="_blank">
                <i class="fab fa-youtube"></i> Canal no YouTube
            </a>

            <div class="divisor">
                <span>Pastores</span>
            </div>

            <a href="URL_PASTOR_1" class="btn secundario" target="_blank">
                <i class="fas fa-user"></i> Pr. Nome do Pastor
            </a>
            <a href="URL_PASTOR_2" class="btn secundario" target="_blank">
                <i class="fas fa-user"></i> Pra. Nome da Pastora
            </a>
        </main>

        <footer>
            <p>© 2024 Nome da Sua Igreja</p>
        </footer>
    </div>

</body>
</html>
