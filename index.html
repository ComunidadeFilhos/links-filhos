<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links | Comunidade Filhos</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css"> <link rel="icon" href="logo.jpg">
</head>
<body>

    <div class="container">
        <header>
            <img src="comunidade filhos.jpg" alt="Logo Comunidade Filhos" class="logo">
            <h1>Comunidade Filhos</h1>
            <p>Uma família para pertencer</p>
        </header>

        <section class="avisos">
            <h3><i class="far fa-calendar-alt"></i> Nossos Cultos</h3>
            <div class="grade-horarios">
                <div class="dia">
                    <strong>Quarta-feira</strong>
                    <span>19h30 | Quarta da Palavra</span>
                </div>
                <div class="dia">
                    <strong>Domingo</strong>
                    <span>19h00 | Culto de Celebração</span>
                </div>
            </div>
        </section>

        <main class="links">
            <a href="https://www.instagram.com/comunidade.filhos/" class="btn principal" target="_blank">
                <i class="fab fa-instagram"></i> Instagram da Igreja
            </a>
            
            <a href="https://www.youtube.com/@ComunidadeEvan" class="btn principal" target="_blank">
                <i class="fab fa-youtube"></i> Canal no YouTube
            </a>

            <div class="divisor">
                <span>Nossos Pastores</span>
            </div>

            <div class="pastores-grid">
                <a href="https://www.instagram.com/franklincoutinhooficial/" class="card-pastor" target="_blank">
                    <img src="pastor franklin.jpg" alt="Pr. Franklin">
                    <span>Pr. Franklin</span>
                </a>
                
                <a href="https://www.instagram.com/nayaragcoutinho/" class="card-pastor" target="_blank">
                    <img src="pastora nayara.jpg" alt="Pra. Nayara">
                    <span>Pra. Nayara</span>
                </a>
            </div>
        </main>

        <footer>
            <p>© 2026 Comunidade Evangélica Filhos</p>
        </footer>
    </div>

</body>
</html>
